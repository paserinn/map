<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>うぇーい！風 矢印ナビ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .arrow-glow {
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6));
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Smooth CSS Transform for Arrow */
    #arrow-container {
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans overflow-x-hidden select-none">

  <!-- Header Bar -->
  <header class="w-full p-4 glass-card sticky top-0 z-50 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-xl shadow-lg">
        W
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
          うぇーい！ナビ
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">迷わない矢印だけのコンパス</p>
      </div>
    </div>
    
    <!-- Mode Switch Toggle -->
    <div class="flex items-center space-x-2 bg-slate-900/80 p-1 rounded-full border border-slate-800">
      <button id="mode-real-btn" onclick="setAppMode('real')" class="px-3 py-1 rounded-full text-xs font-semibold transition-all duration-200 bg-blue-600 text-white shadow">
        <i class="fa-solid fa-location-crosshairs mr-1"></i>GPS
      </button>
      <button id="mode-demo-btn" onclick="setAppMode('demo')" class="px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all duration-200">
        <i class="fa-solid fa-gamepad mr-1"></i>デモ
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 flex flex-col justify-between items-center relative">
    
    <!-- Destination Search & Quick Selection -->
    <section class="w-full glass-card rounded-2xl p-4 shadow-2xl space-y-3 z-10">
      <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider flex justify-between items-center">
        <span><i class="fa-solid fa-flag-checkered text-blue-400 mr-1.5"></i>目的地を設定</span>
        <span id="target-coords-display" class="text-[10px] text-slate-400 font-mono">未設定</span>
      </label>

      <!-- Search Box with Search Action -->
      <div class="relative flex items-center">
        <input type="text" id="place-input" placeholder="地名・スポット名を入力..." 
               class="w-full bg-slate-900/90 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-3 pl-10 pr-24 border border-slate-700/80 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
        <button onclick="searchPlace()" class="absolute right-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-xs rounded-lg shadow transition-all">
          検索
        </button>
      </div>

      <!-- Quick Spot Presets -->
      <div class="space-y-1.5">
        <div class="text-[11px] text-slate-400 font-medium">プリセット場所:</div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="setTargetPreset('立川駅', 35.6983, 139.4137)" class="px-2.5 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700/50 transition-all flex items-center">
            <i class="fa-solid fa-train text-amber-400 mr-1 text-[10px]"></i>立川駅
          </button>
          <button onclick="setTargetPreset('東京タワー', 35.6586, 139.7454)" class="px-2.5 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700/50 transition-all flex items-center">
            <i class="fa-solid fa-tower-observation text-red-400 mr-1 text-[10px]"></i>東京タワー
          </button>
          <button onclick="setTargetPreset('渋谷スクランブル', 35.6595, 139.7005)" class="px-2.5 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700/50 transition-all flex items-center">
            <i class="fa-solid fa-shoe-prints text-indigo-400 mr-1 text-[10px]"></i>渋谷
          </button>
          <button onclick="setTargetPreset('富士山山頂', 35.3606, 138.7274)" class="px-2.5 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700/50 transition-all flex items-center">
            <i class="fa-solid fa-mountain text-emerald-400 mr-1 text-[10px]"></i>富士山
          </button>
        </div>
      </div>
    </section>

    <!-- Main Arrow Indicator Display Section -->
    <section class="my-auto py-6 flex flex-col items-center justify-center w-full relative">
      <!-- Background Pulsing Ring -->
      <div class="absolute w-72 h-72 rounded-full border border-blue-500/20 pointer-events-none" style="animation: pulse-ring 4s infinite ease-in-out;"></div>
      <div class="absolute w-56 h-56 rounded-full border border-indigo-500/10 pointer-events-none"></div>

      <!-- Arrow Container (Rotated dynamically) -->
      <div id="arrow-container" class="relative z-10 my-4 transform duration-200 arrow-glow">
        <svg width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-2xl">
          <defs>
            <linearGradient id="arrowGrad" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60A5FA" />
              <stop offset="60%" stop-color="#3B82F6" />
              <stop offset="100%" stop-color="#1D4ED8" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="8" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Outer Halo Arrow -->
          <path d="M100 15 L175 145 L130 135 L100 185 L70 135 L25 145 Z" fill="#2563EB" opacity="0.3" filter="url(#glow)"/>
          
          <!-- Main Stylish Arrow -->
          <path d="M100 12 L170 142 L122 132 L100 180 L78 132 L30 142 Z" fill="url(#arrowGrad)" stroke="#93C5FD" stroke-width="3" stroke-linejoin="round"/>
          
          <!-- Inner Accent Highlight -->
          <path d="M100 28 L148 132 L115 125 L100 160 Z" fill="#93C5FD" opacity="0.4"/>
        </svg>
      </div>

      <!-- Distance and Heading Readout -->
      <div class="text-center mt-2 z-10 space-y-1">
        <div id="distance-display" class="text-5xl font-black tracking-tight text-white font-mono drop-shadow-md">
          --- <span class="text-2xl font-bold text-slate-400">m</span>
        </div>
        <div id="target-name-display" class="text-sm font-semibold text-blue-300">
          目的地を選択してください
        </div>
      </div>
    </section>

    <!-- Demo Interactive Controller (Visible in Demo Mode) -->
    <section id="demo-controls" class="w-full glass-card rounded-2xl p-4 shadow-xl space-y-3 mb-2 border border-blue-500/30 hidden">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-amber-400 flex items-center">
          <i class="fa-solid fa-sliders mr-1.5"></i>デモ操作パネル (シミュレーター)
        </span>
        <button onclick="resetDemoPosition()" class="text-[10px] text-slate-400 hover:text-white underline">
          現在地リセット
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="text-slate-400 mb-1 block">スマホの向き: <span id="demo-heading-val" class="text-white font-mono">0°</span></label>
          <input type="range" id="demo-heading" min="0" max="360" value="0" oninput="updateDemoHeading(this.value)" class="w-full accent-blue-500 bg-slate-800">
        </div>
        <div>
          <label class="text-slate-400 mb-1 block">目的地へ近づく</label>
          <div class="flex space-x-1">
            <button onclick="moveDemoUser(-0.001)" class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded text-center border border-slate-700 font-bold">
              進む ⬆
            </button>
            <button onclick="moveDemoUser(0.001)" class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded text-center border border-slate-700 font-bold">
              戻る ⬇
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Status & Info Console Footer -->
    <footer class="w-full text-center space-y-2 mb-2">
      <div id="status-badge" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-300">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
        <span id="status-text">位置情報を準備中...</span>
      </div>

      <!-- Compass Calibration / Permission Tip -->
      <div id="permission-btn-container" class="hidden">
        <button onclick="requestSensorPermissions()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl shadow transition-all">
          <i class="fa-solid fa-compass mr-1"></i>iOS用 コンパスセンサーを許可
        </button>
      </div>
    </footer>

  </main>

  <script>
    // State Variables
    let appMode = 'real'; // 'real' or 'demo'
    let currentLat = null;
    let currentLng = null;
    let currentHeading = 0; // 0..360 deg
    let targetLat = 35.6983; // Default: Tachikawa
    let targetLng = 139.4137;
    let targetName = '立川駅';

    // Demo Mode Specific Coordinates
    let demoLat = 35.6900;
    let demoLng = 139.4100;
    let demoHeading = 0;

    let watchPositionId = null;

    // Initialization
    window.onload = () => {
      // Set initial target preset
      setTargetPreset('立川駅', 35.6983, 139.4137);
      
      // Start Real Geolocation by default
      initRealNavigation();
    };

    // Mode Switcher
    function setAppMode(mode) {
      appMode = mode;
      const realBtn = document.getElementById('mode-real-btn');
      const demoBtn = document.getElementById('mode-demo-btn');
      const demoControls = document.getElementById('demo-controls');

      if (mode === 'real') {
        realBtn.className = "px-3 py-1 rounded-full text-xs font-semibold transition-all duration-200 bg-blue-600 text-white shadow";
        demoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all duration-200";
        demoControls.classList.add('hidden');
        initRealNavigation();
      } else {
        demoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold transition-all duration-200 bg-amber-600 text-white shadow";
        realBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all duration-200";
        demoControls.classList.remove('hidden');
        
        if (watchPositionId) {
          navigator.geolocation.clearWatch(watchPositionId);
        }
        updateStatus('デモモード動作中', 'amber');
        updateUI();
      }
    }

    // Set Target Location Preset
    function setTargetPreset(name, lat, lng) {
      targetName = name;
      targetLat = lat;
      targetLng = lng;

      document.getElementById('target-name-display').innerText = targetName;
      document.getElementById('target-coords-display').innerText = `${lat.toFixed(3)}, ${lng.toFixed(3)}`;
      document.getElementById('place-input').value = name;

      updateUI();
    }

    // Simple Search Function using OpenStreetMap Nominatim API
    async function searchPlace() {
      const query = document.getElementById('place-input').value.trim();
      if (!query) return;

      updateStatus('場所を検索中...', 'blue');

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await response.json();

        if (data && data.length > 0) {
          const result = data[0];
          const lat = parseFloat(result.lat);
          const lng = parseFloat(result.lon);
          const displayName = result.display_name.split(',')[0];

          setTargetPreset(displayName, lat, lng);
          updateStatus(`「${displayName}」を設定しました`, 'emerald');
        } else {
          alert('該当する場所が見つかりませんでした。別の言葉で検索してください。');
          updateStatus('検索失敗', 'red');
        }
      } catch (err) {
        alert('検索処理中にエラーが発生しました。');
        updateStatus('通信エラー', 'red');
      }
    }

    // Mathematical Navigation Calculations
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Radius of Earth in meters
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) -
                Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);
      return (θ * 180 / Math.PI + 360) % 360; // 0 ~ 360 deg
    }

    // UI Rotation and Distance Updater
    function updateUI() {
      let activeLat = appMode === 'real' ? currentLat : demoLat;
      let activeLng = appMode === 'real' ? currentLng : demoLng;
      let activeHeading = appMode === 'real' ? currentHeading : demoHeading;

      if (activeLat === null || activeLng === null) {
        document.getElementById('distance-display').innerHTML = `--- <span class="text-2xl font-bold text-slate-400">m</span>`;
        return;
      }

      // 1. Calculate Distance
      const distance = calculateDistance(activeLat, activeLng, targetLat, targetLng);
      
      if (distance >= 1000) {
        document.getElementById('distance-display').innerHTML = `${(distance / 1000).toFixed(2)} <span class="text-2xl font-bold text-slate-400">km</span>`;
      } else {
        document.getElementById('distance-display').innerHTML = `${Math.round(distance)} <span class="text-2xl font-bold text-slate-400">m</span>`;
      }

      // 2. Calculate Bearing Angle
      const targetBearing = calculateBearing(activeLat, activeLng, targetLat, targetLng);
      
      // Calculate Arrow Angle relative to Device Orientation
      let relativeArrowAngle = targetBearing - activeHeading;

      // Apply smoothly to arrow SVG
      const arrowContainer = document.getElementById('arrow-container');
      arrowContainer.style.transform = `rotate(${relativeArrowAngle}deg)`;
    }

    // Real GPS & Orientation Initialization
    function initRealNavigation() {
      updateStatus('GPS衛星を試行中...', 'amber');

      // Setup Device Orientation Listener (Compass)
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS 13+ requiring explicit user gesture authorization
          document.getElementById('permission-btn-container').classList.remove('hidden');
        } else {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }

      // Setup GPS Tracker
      if ('geolocation' in navigator) {
        watchPositionId = navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            updateStatus('GPS測位完了 (高精度)', 'emerald');
            updateUI();
          },
          (error) => {
            handleGeoError(error);
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      } else {
        updateStatus('お使いの環境はGPS非対応です', 'red');
      }
    }

    // Compass Sensor Event Handler
    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        // iOS Compass Direction
        currentHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        // Android Compass Direction (Degrees from absolute North)
        currentHeading = 360 - event.alpha;
      }
      if (appMode === 'real') {
        updateUI();
      }
    }

    // iOS Orientation Sensor Explicit Request
    function requestSensorPermissions() {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              document.getElementById('permission-btn-container').classList.add('hidden');
              updateStatus('コンパスセンサー有効化', 'emerald');
            } else {
              alert('コンパスの使用が拒否されました。方向矢印が固定される可能性があります。');
            }
          })
          .catch(console.error);
      }
    }

    // Geolocation Error Handling
    function handleGeoError(error) {
      let msg = '';
      switch (error.code) {
        case error.PERMISSION_DENIED:
          msg = '位置情報アクセスが拒否されました (デモモードをお使いください)';
          break;
        case error.POSITION_UNAVAILABLE:
          msg = '位置情報が取得できません';
          break;
        case error.TIMEOUT:
          msg = 'GPSレスポンスがタイムアウトしました';
          break;
        default:
          msg = '位置情報エラーが発生しました';
          break;
      }
      updateStatus(msg, 'red');
    }

    // Helper: Update Footer Status Bar Badge
    function updateStatus(text, color) {
      const dot = document.getElementById('status-dot');
      const textEl = document.getElementById('status-text');

      textEl.innerText = text;

      const colorMap = {
        amber: 'bg-amber-500',
        emerald: 'bg-emerald-500',
        blue: 'bg-blue-500',
        red: 'bg-red-500'
      };

      dot.className = `w-2 h-2 rounded-full animate-pulse ${colorMap[color] || 'bg-slate-500'}`;
    }

    // Demo Mode Controllers
    function updateDemoHeading(val) {
      demoHeading = parseFloat(val);
      document.getElementById('demo-heading-val').innerText = `${demoHeading}°`;
      updateUI();
    }

    function moveDemoUser(delta) {
      // Step closer towards target
      const bearing = calculateBearing(demoLat, demoLng, targetLat, targetLng);
      const rad = bearing * Math.PI / 180;

      // Adjust coordinate step
      demoLat += Math.cos(rad) * (delta * 0.1);
      demoLng += Math.sin(rad) * (delta * 0.1);

      updateUI();
    }

    function resetDemoPosition() {
      // Reset demo user near Tachikawa
      demoLat = 35.6900;
      demoLng = 139.4100;
      demoHeading = 0;
      document.getElementById('demo-heading').value = 0;
      document.getElementById('demo-heading-val').innerText = '0°';
      updateUI();
    }
  </script>
</body>
</html>
