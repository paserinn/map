<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>矢印ナビ - PWA＆音声通知対応</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .header-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .version-tag {
      font-size: 11px; color: #007bff; background: #1a2735; padding: 3px 8px; border-radius: 12px; border: 1px solid #0056b3; font-weight: bold;
    }
    h2 { margin: 0; font-size: 20px; }
    .search-box {
      width: 100%; display: flex; gap: 8px; margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px;
    }
    button {
      padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .map-container { position: relative; width: 100%; margin-bottom: 15px; }
    #map { width: 100%; height: 200px; border-radius: 8px; border: 1px solid #333; }
    .locate-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 1000;
      background: #222; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .info-card {
      background: #1e1e1e; width: 100%; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 10px;
    }
    #targetName { font-size: 15px; color: #4dabf7; font-weight: bold; margin-bottom: 5px; }
    #arrow {
      font-size: 130px; line-height: 1; margin: 10px 0; transition: transform 0.1s linear, color 0.3s; display: inline-block; color: #007bff;
    }
    #distance { font-size: 36px; font-weight: bold; color: #20c997; }
    #etaDetails { font-size: 13px; color: #aaa; margin-top: -5px; margin-bottom: 10px; }
    .btn-group {
      display: flex; gap: 6px; margin-top: 10px; width: 100%;
    }
    .sub-btn {
      flex: 1; padding: 8px 4px; font-size: 11px; background: #333; border: 1px solid #555; border-radius: 6px; color: #fff;
    }
    .start-btn {
      width: 100%; margin-top: 10px; padding: 14px; background-color: #28a745; font-size: 16px; border-radius: 8px;
    }
    #status { font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span class="version-tag">v1.3.0</span>
    <h2>矢印ナビ</h2>
    <span style="width: 45px;"></span>
  </div>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="場所や住所を検索（例: 立川駅）">
    <button onclick="searchLocation()">検索</button>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <button class="locate-btn" onclick="moveToCurrentLocation()">📍 現在地へ移動</button>
  </div>

  <div class="info-card">
    <div id="targetName">地図をタップするか検索して目的地をセット</div>
    <div id="distance">-- m</div>
    <div id="etaDetails">徒歩 約 -- 分（約 -- 歩）</div>
    <div id="arrow">⬆</div>
    
    <div class="btn-group">
      <button class="sub-btn" onclick="toggleArrowColor()">🎨 色変更</button>
      <button class="sub-btn" onclick="toggleSpeech()">🔊 音声案内: <span id="speechStatus">ON</span></button>
      <button class="sub-btn" onclick="shareLocation()">🔗 共有</button>
    </div>

    <button id="startBtn" class="start-btn" onclick="startNavigation()">
      🚀 案内開始
    </button>
    <div id="status">目的地を選択してから「案内開始」を押してください</div>
  </div>
</div>

<script>
  let targetLat = null, targetLng = null;
  let currentLat = null, currentLng = null;
  let prevLat = null, prevLng = null;
  let rawHeading = 0;
  let smoothedHeading = 0;
  let autoCompassOffset = 0;
  let map, targetMarker, currentMarker;
  let isNavigating = false;
  let enableSpeech = true;
  let announced50m = false;
  let announced100m = false;
  let hasVibratedForArrival = false;

  const JAPAN_MAGNETIC_DECLINATION = 7.5;
  const ARROW_COLORS = ['#007bff', '#20c997', '#ffc107', '#e83e8c', '#ffffff'];
  let colorIndex = 0;

  window.onload = function() {
    map = L.map('map').setView([35.6995, 139.4137], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('click', function(e) {
      setTarget(e.latlng.lat, e.latlng.lng, 'タップした位置');
    });

    fetchInitialLocationFast();
  };

  function speakText(text) {
    if (!enableSpeech || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    window.speechSynthesis.speak(uttr);
  }

  function toggleSpeech() {
    enableSpeech = !enableSpeech;
    document.getElementById('speechStatus').innerText = enableSpeech ? 'ON' : 'OFF';
  }

  function shareLocation() {
    if (currentLat === null || currentLng === null) {
      alert('現在地を取得後に共有可能です。');
      return;
    }
    const url = `https://maps.google.com/?q=${currentLat},${currentLng}`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url);
      alert('現在地のGoogle Mapsリンクをコピーしました。LINE等に送信できます。');
    }
  }

  function fetchInitialLocationFast() {
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        updateCurrentMarkerOnMap();
      }, null, { enableHighAccuracy: true, maximumAge: 10000, timeout: 3000 });
    }
  }

  function setTarget(lat, lng, label) {
    targetLat = lat; targetLng = lng;
    hasVibratedForArrival = false;
    announced50m = false; announced100m = false;
    document.getElementById('targetName').innerText = `目的地: ${label}`;
    if (targetMarker) map.removeLayer(targetMarker);
    targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
    updateUI();
  }

  function searchLocation() {
    const query = document.getElementById('keyword').value;
    if (!query) return;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.flyTo([lat, lon], 15, { duration: 0.4 });
          setTarget(lat, lon, data[0].display_name.split(',')[0]);
        } else {
          alert('見つかりませんでした。別のキーワードで試してください。');
        }
      });
  }

  function moveToCurrentLocation() {
    if (currentLat !== null && currentLng !== null) {
      map.flyTo([currentLat, currentLng], 16, { duration: 0.3 });
      updateCurrentMarkerOnMap();
      updateUI();
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        map.flyTo([currentLat, currentLng], 16, { duration: 0.3 });
        updateCurrentMarkerOnMap();
        document.getElementById('status').innerText = isNavigating ? 'GPS・コンパス稼働中' : '現在地へ移動しました';
        updateUI();
      }, null, { enableHighAccuracy: true, maximumAge: 3000, timeout: 4000 });
    }
  }

  function updateCurrentMarkerOnMap() {
    if (currentLat === null || currentLng === null) return;
    if (currentMarker) map.removeLayer(currentMarker);
    currentMarker = L.circleMarker([currentLat, currentLng], {
      color: '#007bff', fillColor: '#007bff', fillOpacity: 0.8, radius: 8
    }).addTo(map);
  }

  function toggleArrowColor() {
    colorIndex = (colorIndex + 1) % ARROW_COLORS.length;
    document.getElementById('arrow').style.color = ARROW_COLORS[colorIndex];
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function updateUI() {
    if (currentLat === null || currentLng === null || targetLat === null) return;

    const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
    document.getElementById('distance').innerText = dist >= 1000 
      ? (dist / 1000).toFixed(2) + ' km' 
      : Math.round(dist) + ' m';

    // 歩数・想定時間計算（分速80m換算）
    const steps = Math.round(dist / 0.7);
    const walkMinutes = Math.max(1, Math.round(dist / 67));
    document.getElementById('etaDetails').innerText = `徒歩 約 ${walkMinutes} 分（約 ${steps.toLocaleString()} 歩）`;

    // 音声告知＆到達判定
    if (isNavigating) {
      if (dist <= 100 && dist > 50 && !announced100m) {
        speakText('目的地まで、およそ100メートルです');
        announced100m = true;
      } else if (dist <= 50 && dist > 10 && !announced50m) {
        speakText('まもなく、目的地付近です');
        announced50m = true;
      } else if (dist <= 10 && !hasVibratedForArrival) {
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 400]);
        speakText('目的地付近に到着しました。ナビを完了します');
        hasVibratedForArrival = true;
        document.getElementById('status').innerText = '🎉 目的地付近に到着しました！';
      }
    }

    let finalHeading = (smoothedHeading + autoCompassOffset) % 360;
    const targetBearing = calculateBearing(currentLat, currentLng, targetLat, targetLng);
    let arrowRotation = targetBearing - finalHeading;

    document.getElementById('arrow').style.transform = `rotate(${arrowRotation}deg)`;
  }

  function startNavigation() {
    if (targetLat === null || targetLng === null) {
      alert('先に地図をタップするか検索して目的地を設定してください。');
      return;
    }

    isNavigating = true;
    speakText('ナビゲーションを開始します');
    document.getElementById('startBtn').innerText = 'ナビゲーション中...';
    document.getElementById('startBtn').style.backgroundColor = '#17a2b8';

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleGalaxyOrientation, true);
    } else {
      window.addEventListener('deviceorientation', handleGalaxyOrientation, true);
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          prevLat = currentLat;
          prevLng = currentLng;
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          if (!hasVibratedForArrival) {
            document.getElementById('status').innerText = 'GPS・コンパス稼働中';
          }

          updateCurrentMarkerOnMap();

          if (prevLat !== null && prevLng !== null) {
            const moveDist = calculateDistance(prevLat, prevLng, currentLat, currentLng);
            if (moveDist > 3) {
              const gpsHeading = calculateBearing(prevLat, prevLng, currentLat, currentLng);
              const headingDiff = gpsHeading - smoothedHeading;
              autoCompassOffset = (headingDiff + 360) % 360;
            }
          }

          updateUI();
        },
        (err) => { document.getElementById('status').innerText = 'GPSエラー: ' + err.message; },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 3000 }
      );
    }
  }

  function handleGalaxyOrientation(e) {
    let heading = null;

    if (e.alpha !== null && e.alpha !== undefined) {
      heading = 360 - e.alpha;
    }

    if (heading !== null) {
      heading = (heading + JAPAN_MAGNETIC_DECLINATION) % 360;
      if (heading < 0) heading += 360;

      rawHeading = heading;

      let diff = rawHeading - smoothedHeading;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      smoothedHeading = (smoothedHeading + diff * 0.3) % 360;
      if (smoothedHeading < 0) smoothedHeading += 360;

      updateUI();
    }
  }
</script>

</body>
</html>
