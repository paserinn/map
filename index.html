<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矢印ナビ - 現在地自動更新対応</title>
  <!-- Leaflet.js (無料地図ライブラリ) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
    }
    h2 { margin: 10px 0; font-size: 20px; }
    .search-box {
      width: 100%; display: flex; gap: 8px; margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 6px;
      border: 1px solid #444; background: #222; color: #fff; font-size: 14px;
    }
    button {
      padding: 10px 16px; background-color: #007bff; color: white;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .map-container {
      position: relative; width: 100%; margin-bottom: 15px;
    }
    #map {
      width: 100%; height: 220px; border-radius: 8px;
      border: 1px solid #333;
    }
    .locate-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 1000;
      background: #222; color: #fff; border: 1px solid #555;
      padding: 6px 12px; border-radius: 20px; font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .info-card {
      background: #1e1e1e; width: 100%; padding: 15px; border-radius: 8px;
      text-align: center; margin-bottom: 10px;
    }
    #targetName { font-size: 14px; color: #4dabf7; margin-bottom: 5px; }
    #arrow {
      font-size: 120px; line-height: 1; margin: 15px 0;
      transition: transform 0.1s linear; display: inline-block;
    }
    #distance { font-size: 36px; font-weight: bold; color: #20c997; }
    #status { font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>矢印ナビ</h2>

  <!-- 検索フォーム -->
  <div class="search-box">
    <input type="text" id="keyword" placeholder="場所や住所を検索（例: 立川駅）">
    <button onclick="searchLocation()">検索</button>
  </div>

  <!-- 地図エリア -->
  <div class="map-container">
    <div id="map"></div>
    <button class="locate-btn" onclick="recenterToCurrentLocation()">📍 現在地へ移動</button>
  </div>

  <!-- ナビゲーション表示部 -->
  <div class="info-card">
    <div id="targetName">地図をタップするか検索して目的地をセット</div>
    <div id="distance">-- m</div>
    <div id="arrow">⬆</div>
    <button onclick="startNavigation()" style="width: 100%; margin-top: 10px; background-color: #28a745;">
      位置・コンパスを開始
    </button>
    <div id="status">ボタンを押して各種センサーを有効化してください</div>
  </div>
</div>

<script>
  let targetLat = null;
  let targetLng = null;
  let currentLat = null;
  let currentLng = null;
  let currentHeading = 0;
  let map, targetMarker, currentMarker;
  let hasInitialCentered = false;

  // 初期化：マップの生成
  window.onload = function() {
    map = L.map('map').setView([35.6895, 139.6917], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 地図タップで目的地をセット
    map.on('click', function(e) {
      setTarget(e.latlng.lat, e.latlng.lng, 'タップした位置');
    });
  };

  // 目的地をセット
  function setTarget(lat, lng, label) {
    targetLat = lat;
    targetLng = lng;
    document.getElementById('targetName').innerText = `目的地: ${label}`;

    if (targetMarker) map.removeLayer(targetMarker);
    targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();

    updateUI();
  }

  // 場所の検索
  function searchLocation() {
    const query = document.getElementById('keyword').value;
    if (!query) return;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const result = data[0];
          const lat = parseFloat(result.lat);
          const lon = parseFloat(result.lon);
          map.setView([lat, lon], 15);
          setTarget(lat, lon, result.display_name.split(',')[0]);
        } else {
          alert('見つかりませんでした。別のキーワードで試してください。');
        }
      })
      .catch(() => alert('検索中にエラーが発生しました。'));
  }

  // 現在地へ地図の中心を戻すボタンの処理
  function recenterToCurrentLocation() {
    if (currentLat !== null && currentLng !== null) {
      map.setView([currentLat, currentLng], 16);
    } else {
      alert('現在地を取得中です。「位置・コンパスを開始」ボタンを押してください。');
    }
  }

  // 2点間の距離計算
  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  // 方位角計算
  function calculateBearing(lat1, lon1, lat2, lon2) {
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  // UI更新
  function updateUI() {
    if (currentLat === null || currentLng === null || targetLat === null) return;

    const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
    document.getElementById('distance').innerText = dist >= 1000 
      ? (dist / 1000).toFixed(2) + ' km' 
      : Math.round(dist) + ' m';

    const targetBearing = calculateBearing(currentLat, currentLng, targetLat, targetLng);
    const arrowRotation = targetBearing - currentHeading;
    document.getElementById('arrow').style.transform = `rotate(${arrowRotation}deg)`;
  }

  // ナビゲーション開始
  function startNavigation() {
    // iOSコンパス許可
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(response => {
        if (response === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      });
    } else {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }

    // GPSリアルタイム監視
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          document.getElementById('status').innerText = 'GPS・コンパス稼働中';

          // 初回GPS取得時に現在地を中心へ移動
          if (!hasInitialCentered) {
            map.setView([currentLat, currentLng], 15);
            hasInitialCentered = true;
          }

          // 現在地に青色のマーカーを更新描画
          if (currentMarker) map.removeLayer(currentMarker);
          currentMarker = L.circleMarker([currentLat, currentLng], {
            color: '#007bff',
            fillColor: '#007bff',
            fillOpacity: 0.8,
            radius: 8
          }).addTo(map);

          updateUI();
        },
        (err) => { document.getElementById('status').innerText = 'GPSエラー: ' + err.message; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }
  }

  // コンパス方位の受取
  function handleOrientation(e) {
    if (e.webkitCompassHeading) {
      currentHeading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentHeading = 360 - e.alpha;
    }
    updateUI();
  }
</script>

</body>
</html>
