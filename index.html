<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矢印ナビ - 完全自動方向補正</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
    }
    h2 { margin: 10px 0; font-size: 20px; }
    .search-box {
      width: 100%; display: flex; gap: 8px; margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 6px;
      border: 1px solid #444; background: #222; color: #fff; font-size: 14px;
    }
    button {
      padding: 10px 16px; background-color: #007bff; color: white;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .map-container { position: relative; width: 100%; margin-bottom: 15px; }
    #map { width: 100%; height: 200px; border-radius: 8px; border: 1px solid #333; }
    .locate-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 1000;
      background: #222; color: #fff; border: 1px solid #555;
      padding: 6px 12px; border-radius: 20px; font-size: 12px;
    }
    .info-card {
      background: #1e1e1e; width: 100%; padding: 15px; border-radius: 8px;
      text-align: center; margin-bottom: 10px;
    }
    #targetName { font-size: 14px; color: #4dabf7; margin-bottom: 5px; }
    #arrow {
      font-size: 120px; line-height: 1; margin: 15px 0;
      transition: transform 0.2s ease-out; display: inline-block;
    }
    #distance { font-size: 36px; font-weight: bold; color: #20c997; }
    #autoCalibStatus { font-size: 11px; color: #17a2b8; margin-top: 5px; }
    #status { font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>矢印ナビ</h2>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="場所や住所を検索（例: 立川駅）">
    <button onclick="searchLocation()">検索</button>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <button class="locate-btn" onclick="recenterToCurrentLocation()">📍 現在地へ移動</button>
  </div>

  <div class="info-card">
    <div id="targetName">地図をタップするか検索して目的地をセット</div>
    <div id="distance">-- m</div>
    <div id="arrow">⬆</div>
    <div id="autoCalibStatus">自動補正: 待機中（歩行開始で精度向上）</div>

    <button onclick="startNavigation()" style="width: 100%; margin-top: 10px; background-color: #28a745;">
      位置・コンパスを開始
    </button>
    <div id="status">ボタンを押して各種センサーを有効化してください</div>
  </div>
</div>

<script>
  let targetLat = null, targetLng = null;
  let currentLat = null, currentLng = null;
  let prevLat = null, prevLng = null;
  let rawHeading = 0;
  let smoothedHeading = 0;
  let autoCompassOffset = 0; // 歩行軌跡から自動算出される補正角度
  let map, targetMarker, currentMarker;
  let hasInitialCentered = false;

  const JAPAN_MAGNETIC_DECLINATION = 7.5; // 日本の平均地磁気偏角（磁北→真北補正）

  window.onload = function() {
    map = L.map('map').setView([35.6895, 139.6917], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('click', function(e) {
      setTarget(e.latlng.lat, e.latlng.lng, 'タップした位置');
    });
  };

  function setTarget(lat, lng, label) {
    targetLat = lat; targetLng = lng;
    document.getElementById('targetName').innerText = `目的地: ${label}`;
    if (targetMarker) map.removeLayer(targetMarker);
    targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
    updateUI();
  }

  function searchLocation() {
    const query = document.getElementById('keyword').value;
    if (!query) return;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 15);
          setTarget(lat, lon, data[0].display_name.split(',')[0]);
        }
      });
  }

  function recenterToCurrentLocation() {
    if (currentLat !== null && currentLng !== null) {
      map.setView([currentLat, currentLng], 16);
    }
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function updateUI() {
    if (currentLat === null || currentLng === null || targetLat === null) return;

    const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
    document.getElementById('distance').innerText = dist >= 1000 
      ? (dist / 1000).toFixed(2) + ' km' 
      : Math.round(dist) + ' m';

    // 自動補正適用後のデバイス方位
    let finalHeading = (smoothedHeading + autoCompassOffset) % 360;

    const targetBearing = calculateBearing(currentLat, currentLng, targetLat, targetLng);
    let arrowRotation = targetBearing - finalHeading;

    document.getElementById('arrow').style.transform = `rotate(${arrowRotation}deg)`;
  }

  function startNavigation() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(response => {
        if (response === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      });
    } else {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          prevLat = currentLat;
          prevLng = currentLng;
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          document.getElementById('status').innerText = 'GPS・コンパス稼働中';

          if (!hasInitialCentered) {
            map.setView([currentLat, currentLng], 15);
            hasInitialCentered = true;
          }

          if (currentMarker) map.removeLayer(currentMarker);
          currentMarker = L.circleMarker([currentLat, currentLng], {
            color: '#007bff', fillColor: '#007bff', fillOpacity: 0.8, radius: 8
          }).addTo(map);

          // 移動ベクトルによるコンパス自動キャリブレーション処理
          if (prevLat !== null && prevLng !== null) {
            const moveDist = calculateDistance(prevLat, prevLng, currentLat, currentLng);
            // 3メートル以上移動した際にGPS移動方位とコンパス値を突き合わせて自動補正
            if (moveDist > 3) {
              const gpsHeading = calculateBearing(prevLat, prevLng, currentLat, currentLng);
              const headingDiff = gpsHeading - smoothedHeading;
              autoCompassOffset = (headingDiff + 360) % 360;
              document.getElementById('autoCalibStatus').innerText = '自動補正: 最適化完了';
            }
          }

          updateUI();
        },
        (err) => { document.getElementById('status').innerText = 'GPSエラー: ' + err.message; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }
  }

  // ノイズ除去・低周波フィルタリング処理
  function handleOrientation(e) {
    let heading = null;

    if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
      heading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      heading = 360 - e.alpha;
    }

    if (heading !== null) {
      const screenOrientation = (window.screen.orientation && window.screen.orientation.angle) || window.orientation || 0;
      heading = (heading + screenOrientation + JAPAN_MAGNETIC_DECLINATION) % 360;
      if (heading < 0) heading += 360;

      rawHeading = heading;

      // ローパスフィルタ（滑らかな動きへ変換）
      let diff = rawHeading - smoothedHeading;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      smoothedHeading = (smoothedHeading + diff * 0.2) % 360;
      if (smoothedHeading < 0) smoothedHeading += 360;

      updateUI();
    }
  }
</script>

</body>
</html>
