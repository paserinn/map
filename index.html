<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>矢印ナビ - v2.1.0 超進化学習版</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; transition: background-color 0.3s;
    }
    body.high-contrast { background-color: #000000; color: #ffff00; }
    .container {
      width: 100%; max-width: 480px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; position: relative;
    }
    .header-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .version-tag {
      font-size: 11px; color: #007bff; background: #1a2735; padding: 2px 6px; border-radius: 10px; border: 1px solid #0056b3; font-weight: bold;
    }
    .help-btn {
      font-size: 10px; background: #333; color: #fff; border: 1px solid #555; padding: 3px 6px; border-radius: 10px; cursor: pointer;
    }
    h2 { margin: 0; font-size: 16px; }
    .search-box { width: 100%; display: flex; gap: 4px; margin-bottom: 6px; }
    input[type="text"] {
      flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-size: 12px;
    }
    button {
      padding: 6px 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;
    }
    .fav-bar {
      width: 100%; display: flex; gap: 4px; overflow-x: auto; margin-bottom: 6px; padding-bottom: 2px;
    }
    .fav-chip {
      background: #2a2a2a; border: 1px solid #444; padding: 2px 6px; border-radius: 12px; font-size: 10px; color: #4dabf7; white-space: nowrap; cursor: pointer;
    }
    .map-container { position: relative; width: 100%; margin-bottom: 8px; }
    #map { width: 100%; height: 160px; border-radius: 6px; border: 1px solid #333; }
    .north-compass {
      position: absolute; top: 8px; right: 8px; z-index: 1000;
      width: 32px; height: 32px; background: rgba(0,0,0,0.7); border: 1px solid #555;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-weight: bold; color: #ff4757; font-size: 12px;
    }
    .locate-btn {
      position: absolute; bottom: 6px; right: 6px; z-index: 1000;
      background: #222; color: #fff; border: 1px solid #555; padding: 4px 10px; border-radius: 15px; font-size: 10px; font-weight: bold;
    }
    .info-card {
      background: #1e1e1e; width: 100%; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 6px; position: relative;
    }
    body.high-contrast .info-card { background: #000; border: 2px solid #ffff00; }
    #targetName { font-size: 13px; color: #4dabf7; font-weight: bold; margin-bottom: 2px; }
    
    .arrow-wrapper {
      position: relative; display: inline-flex; justify-content: center; align-items: center; width: 140px; height: 140px; margin: 4px 0;
    }
    .compass-dial {
      position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.2);
      display: flex; justify-content: center; align-items: center; font-size: 10px; color: rgba(255,255,255,0.4); pointer-events: none;
    }
    .target-dot {
      position: absolute; width: 8px; height: 8px; background: #ff4757; border-radius: 50%; top: 4px; left: 61px;
    }
    #arrow {
      font-size: 100px; line-height: 1; transition: transform 0.1s linear, color 0.3s; display: inline-block; color: #007bff; z-index: 2;
    }
    
    #distance { font-size: 28px; font-weight: bold; color: #20c997; }
    #etaDetails { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    #extraStats { font-size: 10px; color: #f39c12; margin-bottom: 6px; }
    
    .btn-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; width: 100%;
    }
    .sub-btn {
      padding: 5px 2px; font-size: 9px; background: #2c2c2c; border: 1px solid #444; border-radius: 4px; color: #ddd;
    }
    .start-btn {
      width: 100%; margin-top: 6px; padding: 10px; background-color: #28a745; font-size: 14px; border-radius: 4px;
    }
    #navTimer { font-size: 10px; color: #20c997; margin-top: 2px; }
    #status { font-size: 10px; color: #888; margin-top: 4px; }

    .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; pointer-events: none; }
    .toast {
      background: rgba(30, 30, 30, 0.95); color: #fff; border: 1px solid #007bff;
      padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: bold;
      opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 10px;
    }
    .modal-content {
      background: #222; border-radius: 8px; padding: 12px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; color: #ddd; font-size: 11px; line-height: 1.5;
    }
    .modal-header { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: #d9534f; border: none; padding: 2px 6px; border-radius: 4px; color: white; cursor: pointer; font-size: 10px; }
  </style>
</head>
<body>

<div class="container" id="mainApp">
  <div class="header-bar" id="headerArea">
    <span class="version-tag">v2.1.0</span>
    <h2>矢印ナビ</h2>
    <div>
      <button class="help-btn" onclick="openSosModal()" style="background:#d9534f; border:none;">🚨 SOS</button>
      <button class="help-btn" onclick="openConfigModal()">⚙ 設定</button>
      <button class="help-btn" onclick="openModal()">❓ ヘルプ</button>
    </div>
  </div>

  <div class="search-box" id="searchArea">
    <input type="text" id="keyword" placeholder="場所や住所を検索（例: 立川駅）">
    <button onclick="searchLocation()">検索</button>
  </div>

  <div class="fav-bar" id="favBar">
    <span style="font-size:10px; color:#666; line-height:20px;">保存:</span>
  </div>

  <div class="map-container" id="mapArea">
    <div id="map"></div>
    <div class="north-compass"><span id="northNeedle">N</span></div>
    <button class="locate-btn" onclick="moveToCurrentLocation()">📍 現在地へ移動</button>
  </div>

  <div class="info-card">
    <div id="targetName">地図をタップするか検索して目的地をセット</div>
    <div id="distance">-- m</div>
    <div id="etaDetails">徒歩 約 -- 分（約 -- 歩） | 到着予定 --:--</div>
    <div id="extraStats">速度: 0.0 km/h | 標高: -- m | 判定: 10m</div>
    
    <div class="arrow-wrapper">
      <div class="compass-dial" id="compassDial">
        <div class="target-dot"></div>
        N
      </div>
      <div id="arrow">⬆</div>
    </div>
    
    <div class="btn-grid" id="controlBtns">
      <button class="sub-btn" onclick="changeTransportMode()">🏃 <span id="modeText">徒歩</span></button>
      <button class="sub-btn" onclick="adjustCompass(-10)">↺ -10°</button>
      <button class="sub-btn" onclick="adjustCompass(10)">↻ +10°</button>
      <button class="sub-btn" onclick="toggleFlip180()">🔁 180°反転</button>
      <button class="sub-btn" onclick="toggleMapTile()">🗺 地図切替</button>
      <button class="sub-btn" onclick="saveToFavorites()">⭐ 保存</button>
      <button class="sub-btn" onclick="openExternalMaps()">🗺 Gマップ</button>
      <button class="sub-btn" onclick="toggleCleanView()">👁 UI隠す</button>
      <button class="sub-btn" onclick="toggleSpeech()">🔊 音声:<span id="speechStatus">ON</span></button>
      <button class="sub-btn" onclick="shareLocation()">🔗 共有</button>
    </div>

    <button id="startBtn" class="start-btn" onclick="toggleStartPause()">🚀 案内開始</button>
    <div id="navTimer">経過時間: --:--</div>
    <div id="status">目的地を選択してから「案内開始」を押してください</div>
  </div>
</div>

<div class="toast-container"><div id="toast" class="toast">✨ メッセージ</div></div>

<!-- 設定 モーダル -->
<div id="configModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header"><span>⚙ 詳細設定</span><button class="close-btn" onclick="closeConfigModal()">✕</button></div>
    <label>到着判定距離: 
      <select id="arrivalDistSelect" onchange="updateArrivalDistSetting()">
        <option value="5">5m</option>
        <option value="10" selected>10m</option>
        <option value="20">20m</option>
        <option value="50">50m</option>
      </select>
    </label><br><br>
    <button onclick="toggleContrast()" style="width:100%; margin-bottom:6px;">🌙 夜間・高コントラスト切替</button>
    <button onclick="exportFavorites()" style="width:100%; margin-bottom:6px;">📥 お気に入りバックアップ</button>
    <button onclick="importFavorites()" style="width:100%; margin-bottom:6px;">📤 お気に入り復元</button>
    <button onclick="resetAllData()" style="width:100%; background:#d9534f;">🔄 全設定・全データリセット</button>
  </div>
</div>

<!-- SOS モーダル -->
<div id="sosModal" class="modal-overlay">
  <div class="modal-content" style="border: 2px solid #d9534f;">
    <div class="modal-header" style="color: #ff6b6b;"><span>🚨 緊急SOS</span><button class="close-btn" onclick="closeSosModal()">✕</button></div>
    <div id="sosCoords" style="background:#111; padding:8px; font-family:monospace; color:#20c997; text-align:center; margin:8px 0;">取得中...</div>
    <button onclick="copySosCoords()" style="width:100%; background:#007bff;">現在地座標をコピー</button>
  </div>
</div>

<!-- ヘルプ モーダル -->
<div id="helpModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header"><span>📖 アプリ機能一覧（v2.1.0）</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <p>Waaaaay!風の超高機能矢印ナビアプリです。</p>
  </div>
</div>

<script>
  let targetLat = null, targetLng = null;
  let currentLat = null, currentLng = null;
  let prevLat = null, prevLng = null;
  let rawHeading = 0, smoothedHeading = 0;
  let manualOffset = 0, autoCompassOffset = 0, flip180Offset = 0;
  let map, targetMarker, currentMarker, polyline;
  let isNavigating = false, isPaused = false, enableSpeech = true, isCleanView = false;
  let announced50m = false, announced100m = false, hasVibratedForArrival = false;
  let navStartTime = null, timerInterval = null;
  let toastTimeout = null, wakeLock = null;
  let currentSpeed = 0, currentAltitude = 0, arrivalThreshold = 10;

  const JAPAN_MAGNETIC_DECLINATION = 7.5;
  const MODES = [
    { name: '徒歩', speedMin: 67, stepLen: 0.7 },
    { name: 'ラン', speedMin: 150, speedLen: 0.9 },
    { name: 'チャリ', speedMin: 250, stepLen: 2.0 }
  ];
  let modeIdx = 0;

  const TILES = {
    standard: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  };
  let currentTileLayer;

  function playBeep(freq = 880, type = 'sine', duration = 0.15) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  window.onload = function() {
    map = L.map('map').setView([35.6995, 139.4137], 13);
    currentTileLayer = L.tileLayer(TILES.standard, { attribution: '© OpenStreetMap' }).addTo(map);

    map.on('click', function(e) {
      setTarget(e.latlng.lat, e.latlng.lng, 'タップした位置');
    });

    renderFavorites();
    fetchInitialLocationFast();
    checkOnlineStatus();
    window.addEventListener('online', checkOnlineStatus);
    window.addEventListener('offline', checkOnlineStatus);
  };

  function checkOnlineStatus() {
    if (!navigator.onLine) showToast('⚠️ ネットワーク未接続（オフライン）');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function openModal() { document.getElementById('helpModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('helpModal').style.display = 'none'; }
  function openConfigModal() { document.getElementById('configModal').style.display = 'flex'; }
  function closeConfigModal() { document.getElementById('configModal').style.display = 'none'; }
  function openSosModal() {
    document.getElementById('sosModal').style.display = 'flex';
    if (currentLat !== null) {
      document.getElementById('sosCoords').innerText = `緯度: ${currentLat.toFixed(6)}\n経度: ${currentLng.toFixed(6)}`;
    }
  }
  function closeSosModal() { document.getElementById('sosModal').style.display = 'none'; }

  function toggleCleanView() {
    isCleanView = !isCleanView;
    const disp = isCleanView ? 'none' : '';
    document.getElementById('headerArea').style.display = disp;
    document.getElementById('searchArea').style.display = disp;
    document.getElementById('favBar').style.display = disp;
    document.getElementById('mapArea').style.display = disp;
    showToast(isCleanView ? '👁 UI隠しモード (タップで復帰)' : '👁 通常表示モード');
  }

  function toggleFlip180() {
    flip180Offset = (flip180Offset === 0) ? 180 : 0;
    showToast(`🔁 180°反転: ${flip180Offset === 180 ? 'ON' : 'OFF'}`);
    updateUI();
  }

  function updateArrivalDistSetting() {
    arrivalThreshold = parseInt(document.getElementById('arrivalDistSelect').value);
    showToast(`🎯 到着判定: ${arrivalThreshold}m に変更`);
    updateUI();
  }

  function toggleContrast() {
    document.body.classList.toggle('high-contrast');
    showToast('🌙 夜間モード切替');
  }

  function resetAllData() {
    if (confirm('すべての設定とお気に入りを初期化しますか？')) {
      localStorage.clear();
      renderFavorites();
      closeConfigModal();
      showToast('🔄 全データをリセットしました');
    }
  }

  function copySosCoords() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(document.getElementById('sosCoords').innerText);
      showToast('📋 座標をコピーしました');
    }
  }

  function changeTransportMode() {
    modeIdx = (modeIdx + 1) % MODES.length;
    document.getElementById('modeText').innerText = MODES[modeIdx].name;
    showToast(`🏃 モード: ${MODES[modeIdx].name}`);
    updateUI();
  }

  function adjustCompass(deg) {
    manualOffset += deg;
    showToast(`🧭 角度補正: ${manualOffset}°`);
    updateUI();
  }

  function toggleMapTile() {
    map.removeLayer(currentTileLayer);
    if (currentTileLayer._url === TILES.standard) {
      currentTileLayer = L.tileLayer(TILES.dark, { attribution: '© CartoDB' }).addTo(map);
      showToast('🗺 ダークマップ');
    } else {
      currentTileLayer = L.tileLayer(TILES.standard, { attribution: '© OpenStreetMap' }).addTo(map);
      showToast('🗺 標準マップ');
    }
  }

  function openExternalMaps() {
    if (targetLat === null) { showToast('⚠️ 目的地が未設定です'); return; }
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${targetLat},${targetLng}`, '_blank');
  }

  function saveToFavorites() {
    if (targetLat === null) { showToast('⚠️ 先に目的地をセットしてください'); return; }
    const label = prompt('登録名を入力:', document.getElementById('targetName').innerText.replace('目的地: ', ''));
    if (!label) return;

    let favs = JSON.parse(localStorage.getItem('navi_favs') || '[]');
    favs.push({ name: label, lat: targetLat, lng: targetLng });
    localStorage.setItem('navi_favs', JSON.stringify(favs));
    renderFavorites();
    showToast(`⭐ 「${label}」を保存`);
  }

  function exportFavorites() {
    const data = localStorage.getItem('navi_favs') || '[]';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(data);
      showToast('📥 お気に入りJSONをクリップボードにコピー');
    }
  }

  function importFavorites() {
    const json = prompt('復元用JSONデータを貼り付けてください:');
    if (json) {
      try {
        JSON.parse(json);
        localStorage.setItem('navi_favs', json);
        renderFavorites();
        showToast('📤 復元が完了しました');
      } catch(e) { showToast('❌ 不正なJSONデータです'); }
    }
  }

  function renderFavorites() {
    const favBar = document.getElementById('favBar');
    let favs = JSON.parse(localStorage.getItem('navi_favs') || '[]');
    favBar.innerHTML = '<span style="font-size:10px; color:#666; line-height:20px;">保存:</span>';
    favs.forEach(f => {
      const chip = document.createElement('span');
      chip.className = 'fav-chip';
      chip.innerText = f.name;
      chip.onclick = () => {
        map.flyTo([f.lat, f.lng], 15);
