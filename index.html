<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>矢印ナビ - シンプル洗練版</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px; padding: 12px;
      display: flex; flex-direction: column; align-items: center;
    }
    .header-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .version-tag {
      font-size: 11px; color: #007bff; background: #1a2735; padding: 2px 6px; border-radius: 10px; border: 1px solid #0056b3; font-weight: bold;
    }
    h2 { margin: 0; font-size: 18px; }
    .search-box { width: 100%; display: flex; gap: 6px; margin-bottom: 8px; }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px;
    }
    button.search-btn {
      padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .map-container { position: relative; width: 100%; margin-bottom: 10px; }
    #map { width: 100%; height: 200px; border-radius: 8px; border: 1px solid #333; background: #222; }
    .north-compass {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      width: 36px; height: 36px; background: rgba(0,0,0,0.7); border: 1px solid #555;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-weight: bold; color: #ff4757; font-size: 13px;
    }
    .locate-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 1000;
      background: #222; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .info-card {
      background: #1e1e1e; width: 100%; padding: 16px; border-radius: 10px; text-align: center;
    }
    #targetName { font-size: 15px; color: #4dabf7; font-weight: bold; margin-bottom: 6px; }
    #distance { font-size: 42px; font-weight: bold; color: #20c997; line-height: 1.1; }
    #etaDetails { font-size: 13px; color: #aaa; margin-top: 4px; margin-bottom: 12px; }
    
    .arrow-wrapper {
      display: inline-flex; justify-content: center; align-items: center; width: 160px; height: 160px; margin: 10px 0;
    }
    #arrow {
      font-size: 130px; line-height: 1; transition: transform 0.12s ease-out, color 0.3s; display: inline-block; color: #007bff;
    }
    
    #status { font-size: 12px; color: #888; margin-top: 8px; }

    /* トースト表示 */
    .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; pointer-events: none; }
    .toast {
      background: rgba(30, 30, 30, 0.95); color: #fff; border: 1px solid #007bff;
      padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: bold;
      opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span class="version-tag">v2.3.0</span>
    <h2>矢印ナビ</h2>
    <span style="width: 45px;"></span>
  </div>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="場所や住所を検索（例: 立川駅）">
    <button class="search-btn" onclick="searchLocation()">検索</button>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="north-compass"><span id="northNeedle">N</span></div>
    <button class="locate-btn" onclick="moveToCurrentLocation()">📍 現在地へ移動</button>
  </div>

  <div class="info-card">
    <div id="targetName">地図をタップするか検索して目的地を選択</div>
    <div id="distance">-- m</div>
    <div id="etaDetails">徒歩 約 -- 分（約 -- 歩）</div>
    
    <div class="arrow-wrapper">
      <div id="arrow">⬆</div>
    </div>
    
    <div id="status">目的地を選択するとナビゲーションが始まります</div>
  </div>
</div>

<div class="toast-container"><div id="toast" class="toast">✨ メッセージ</div></div>

<script>
  let targetLat = null, targetLng = null;
  let currentLat = null, currentLng = null;
  let prevLat = null, prevLng = null;
  let rawHeading = 0, smoothedHeading = 0;
  let autoCompassOffset = 0;
  let map = null, targetMarker = null, currentMarker = null, polyline = null;
  let isNavigating = false;
  let announced50m = false, announced100m = false, hasVibratedForArrival = false;
  let toastTimeout = null, wakeLock = null;

  const JAPAN_MAGNETIC_DECLINATION = 7.5;

  window.onload = function() {
    initMap();
    startSensors();
  };

  function initMap() {
    if (typeof L === 'undefined') return;
    try {
      map = L.map('map').setView([35.6995, 139.4137], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
      }).addTo(map);

      map.on('click', function(e) {
        setTarget(e.latlng.lat, e.latlng.lng, 'タップした位置');
      });
    } catch (e) {}
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.innerText = msg;
    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function setTarget(lat, lng, label) {
    targetLat = lat; targetLng = lng;
    hasVibratedForArrival = false; announced50m = false; announced100m = false;
    document.getElementById('targetName').innerText = `目的地: ${label}`;
    
    if (map) {
      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
    }

    if (!isNavigating) {
      isNavigating = true;
      requestWakeLock();
      document.getElementById('status').innerText = 'GPS・コンパス連動中';
    }

    updatePolyline();
    updateUI();
  }

  function updatePolyline() {
    if (!map) return;
    if (currentLat !== null && currentLng !== null && targetLat !== null && targetLng !== null) {
      if (polyline) map.removeLayer(polyline);
      polyline = L.polyline([[currentLat, currentLng], [targetLat, targetLng]], { color: '#ff4757', weight: 3, dashArray: '5, 8' }).addTo(map);
    }
  }

  function searchLocation() {
    const query = document.getElementById('keyword').value;
    if (!query) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          if (map) map.flyTo([lat, lon], 15, { duration: 0.4 });
          setTarget(lat, lon, data[0].display_name.split(',')[0]);
          showToast(`🎯 ${data[0].display_name.split(',')[0]} をセット`);
        } else {
          showToast('❌ 見つかりませんでした');
        }
      });
  }

  function moveToCurrentLocation() {
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        if (map) map.flyTo([currentLat, currentLng], 16, { duration: 0.3 });
        updateCurrentMarkerOnMap();
        updatePolyline();
        showToast('📍 現在地に移動しました');
        updateUI();
      }, null, { enableHighAccuracy: true, maximumAge: 3000, timeout: 4000 });
    }
  }

  function updateCurrentMarkerOnMap() {
    if (!map || currentLat === null || currentLng === null) return;
    if (currentMarker) map.removeLayer(currentMarker);
    currentMarker = L.circleMarker([currentLat, currentLng], { color: '#007bff', fillColor: '#007bff', fillOpacity: 0.8, radius: 8 }).addTo(map);
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function updateUI() {
    if (currentLat === null || currentLng === null || targetLat === null || targetLng === null) return;

    const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
    document.getElementById('distance').innerText = dist >= 1000 ? (dist / 1000).toFixed(2) + ' km' : Math.round(dist) + ' m';

    const steps = Math.round(dist / 0.7);
    const estMinutes = Math.max(1, Math.round(dist / 67));
    document.getElementById('etaDetails').innerText = `徒歩 約 ${estMinutes} 分（約 ${steps.toLocaleString()} 歩）`;

    const arrowElem = document.getElementById('arrow');
    if (dist <= 10) arrowElem.style.color = '#ff4757';
    else if (dist <= 50) arrowElem.style.color = '#ffa502';
    else arrowElem.style.color = '#007bff';

    let finalHeading = (smoothedHeading + autoCompassOffset) % 360;
    const targetBearing = calculateBearing(currentLat, currentLng, targetLat, targetLng);
    let arrowRotation = targetBearing - finalHeading;

    document.getElementById('northNeedle').style.transform = `rotate(${-finalHeading}deg)`;
    arrowElem.style.transform = `rotate(${arrowRotation}deg)`;

    if (isNavigating) {
      if (dist <= 50 && dist > 10 && !announced50m) {
        if ('vibrate' in navigator) navigator.vibrate([150, 100, 150]);
        showToast('📢 まもなく目的地付近です');
        announced50m = true;
      } else if (dist <= 10 && !hasVibratedForArrival) {
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 400]);
        if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        hasVibratedForArrival = true;
        showToast('🎉 目的地に到着しました！');
        document.getElementById('status').innerText = '🎉 目的地に到着しました！';
      }
    }
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
  }

  function startSensors() {
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleGalaxyOrientation, true);
    } else {
      window.addEventListener('deviceorientation', handleGalaxyOrientation, true);
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          prevLat = currentLat; prevLng = currentLng;
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;

          updateCurrentMarkerOnMap();
          updatePolyline();

          if (prevLat !== null && prevLng !== null) {
            const moveDist = calculateDistance(prevLat, prevLng, currentLat, currentLng);
            if (moveDist > 3) {
              const gpsHeading = calculateBearing(prevLat, prevLng, currentLat, currentLng);
              autoCompassOffset = (gpsHeading - smoothedHeading + 360) % 360;
            }
          }
          updateUI();
        },
        (err) => {},
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 3000 }
      );
    }
  }

  function handleGalaxyOrientation(e) {
    let heading = null;
    if (e.alpha !== null && e.alpha !== undefined) heading = 360 - e.alpha;

    if (heading !== null) {
      heading = (heading + JAPAN_MAGNETIC_DECLINATION) % 360;
      if (heading < 0) heading += 360;

      rawHeading = heading;
      let diff = rawHeading - smoothedHeading;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      smoothedHeading = (smoothedHeading + diff * 0.25) % 360;
      if (smoothedHeading < 0) smoothedHeading += 360;

      updateUI();
    }
  }
</script>

</body>
</html>
